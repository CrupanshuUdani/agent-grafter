[workspace]
members = ["crates/safelink", "crates/agent-grafter"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CrupanshuUdani/agent-grafter"
# Determined empirically (not from the edition-2024 floor alone -- that
# floor is 1.85.0, but this codebase's if-let chains, e.g.
# crates/agent-grafter/src/manifest.rs, require the let-chains feature
# stabilized in 1.88.0): `cargo +1.87.0 check --workspace --all-targets`
# fails with E0658 on those chains; `cargo +1.88.0 check --workspace
# --all-targets` and `cargo +1.88.0 test --workspace` both pass. See
# README.md's Requirements section.
rust-version = "1.88"
