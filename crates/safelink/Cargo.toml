[package]
name = "safelink"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Explicit, non-guessing link materialization for Windows, macOS and Linux"

[dependencies]
# Runtime dep, not dev-only: `RealProbe` (Task 6) uses it outside #[cfg(test)].
# A regular dependency is visible to unit AND integration tests, so there is
# no separate [dev-dependencies] entry and no manifest edit later in the plan.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
junction = "2.0"
