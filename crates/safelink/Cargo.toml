[package]
name = "safelink"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Explicit, non-guessing link materialization for Windows, macOS and Linux"
keywords = ["symlink", "junction", "ntfs", "filesystem", "windows"]
categories = ["filesystem", "os::windows-apis", "os::unix-apis"]
# crates.io only; about.toml relies on this to leave our own crates out of THIRD-PARTY-LICENSES.
publish = ["crates-io"]

[dependencies]
# Runtime dep, not dev-only: `RealProbe` (Task 6) uses it outside #[cfg(test)].
# A regular dependency is visible to unit AND integration tests, so there is
# no separate [dev-dependencies] entry and no manifest edit later in the plan.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
junction = "2.0"
