[package]
name = "agent-grafter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI that materializes declared AI agent config/state file pairs across Windows/macOS/Linux"
readme = "README.md"
keywords = ["ai-agents", "dotfiles", "symlink", "junction", "cli"]
categories = ["command-line-utilities", "config", "development-tools", "filesystem"]
# crates.io only; about.toml relies on this to leave our own crates out of THIRD-PARTY-LICENSES.
publish = ["crates-io"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `version` alongside `path` is required to publish: cargo strips the path
# from the published manifest and resolves safelink from crates.io instead,
# so without a version the publish is refused outright. Consequence worth
# knowing: safelink must be published BEFORE agent-grafter, and this version
# must be bumped in lockstep with safelink's own.
safelink = { path = "../safelink", version = "0.1.0" }
cliclack = "0.5"

[dev-dependencies]
tempfile = "3"

# Only used by the `examples/gen-manpage.rs` generator (packaging-time only,
# not the shipped `agent-grafter` binary — see that example's doc comment).
# A plain `dev-dependency` + `examples/` file, not a `[[bin]]`, so a
# consumer's `cargo install agent-grafter` never installs a second,
# generically-named `gen-manpage` binary alongside the real CLI: `cargo
# install` ignores `examples/` and dev-dependencies entirely. Unlike an
# optional dependency behind a Cargo feature (the previous approach here),
# this still gets compiled — and can fail — under a plain `cargo build
# --all-targets` / `cargo test` / `cargo clippy --all-targets`, so a broken
# generator cannot go unnoticed in CI. MIT OR Apache-2.0, rust-version 1.85,
# under this workspace's 1.88 MSRV. Its only dependency this workspace
# lacked, `roff` 1.1.1, is also MIT OR Apache-2.0.
clap_mangen = "0.3.3"

[target.'cfg(windows)'.dependencies]
# Already in Cargo.lock transitively via `safelink`'s `junction` dependency
# at this same 0.61 line, so promoting it to a direct dependency here adds
# no new crate to the dependency graph. MIT OR Apache-2.0 (verified against
# its own Cargo.toml, matching this workspace's Apache-2.0 license.workspace
# decision) -- see winenv.rs and this task's report for what was checked.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
