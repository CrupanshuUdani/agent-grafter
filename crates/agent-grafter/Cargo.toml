[package]
name = "agent-grafter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI that materializes declared AI agent config/state file pairs across Windows/macOS/Linux"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
safelink = { path = "../safelink" }

[dev-dependencies]
tempfile = "3"
