name: Docker musl build

# Separate workflow file from ci.yml (not merged into it): this job builds
# and verifies a fully static Linux binary in Docker, an independent concern
# from the native cargo build/test/lint/deny jobs in ci.yml, and keeping it
# in its own file avoids any risk of colliding with concurrent edits to
# ci.yml from other CI-hardening work in this same plan.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  musl-static-build:
    name: musl static build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default `docker` buildx driver's support for exporters like
      # `--output type=local` is version-dependent. A `docker-container`
      # builder (what this action creates) supports every exporter
      # unconditionally, so this removes that question rather than hoping
      # the runner's preinstalled buildx driver happens to support it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds `agent-grafter` for x86_64-unknown-linux-musl with
      # -C target-feature=+crt-static (see Dockerfile) and exports ONLY the
      # `export` stage (a `scratch` image containing just the binary) to
      # ./dist on the runner's filesystem. No `docker create`/`docker cp`
      # container needed.
      #
      # --cache-from/--cache-to type=gha: without these, every run is a cold
      # `--release` build of the whole dependency tree, which is by far the
      # most expensive job in this repo. The native jobs in ci.yml already
      # cache their dependencies (Swatinem/rust-cache); this is the same
      # intent applied to the one build that runs inside Docker, where that
      # action cannot reach. mode=max caches intermediate layers too, not
      # just the final one, which is what actually helps a multi-stage build.
      - name: Build static musl binary
        run: |
          docker buildx build \
            --target export \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=local,dest=dist \
            -f Dockerfile .

      # Do not trust "built with the musl target" to mean "genuinely
      # static" -- a musl-target build can still end up dynamically linking
      # musl libc itself if not built correctly. This mirrors the existing
      # "assert the assumption actually held" convention already in ci.yml
      # (the Windows elevation check, the "safety suite actually ran" check):
      # fail the build loudly if the binary is not what it claims to be,
      # rather than letting Task 6 discover a dynamically-linked binary
      # later.
      #
      # `file`/`readelf` report this as "static-pie linked" (a PIE binary
      # that is nonetheless fully self-contained), not the older plain
      # "statically linked" wording -- that is still genuinely static: the
      # real proof is zero PT_INTERP and zero DT_NEEDED entries, which is
      # exactly what this step checks.
      - name: Verify the binary is genuinely statically linked
        run: |
          set -euo pipefail
          BIN=dist/agent-grafter
          echo "---- file ----"
          file "$BIN"
          echo "---- ldd ----"
          ldd "$BIN" || true
          echo "---- readelf -l (looking for PT_INTERP) ----"
          readelf -l "$BIN"
          if readelf -l "$BIN" | grep -qi interp; then
            echo "::error::binary has a PT_INTERP segment -- it requires a dynamic loader and is NOT genuinely static"
            exit 1
          fi
          echo "---- readelf -d (looking for DT_NEEDED) ----"
          readelf -d "$BIN"
          if readelf -d "$BIN" 2>/dev/null | grep -qi needed; then
            echo "::error::binary has DT_NEEDED entries -- it dynamically links a shared library and is NOT genuinely static"
            exit 1
          fi
          echo "Confirmed: no PT_INTERP, no DT_NEEDED -- agent-grafter is genuinely statically linked."

      # Named artifact Task 6 (multi-distro smoke test) downloads by this
      # exact name via actions/download-artifact@v4, then runs
      # dist/agent-grafter directly (no further extraction step). Note for
      # Task 6's implementer: upload-artifact zips the contents; always
      # `chmod +x dist/agent-grafter` after download before invoking it, in
      # case the executable bit did not survive the round trip.
      - name: Upload static binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-grafter-musl-x86_64
          path: dist/agent-grafter
          if-no-files-found: error

  # Task 6 (multi-distro smoke test): "genuinely static" per readelf is not
  # the same claim as "actually runs everywhere" -- this job is the real
  # end-to-end proof, not a restatement of the previous job's linkage check.
  multi-distro-smoke-test:
    name: multi-distro smoke test (${{ matrix.distro }})
    needs: musl-static-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, alpine, fedora]
    steps:
      # Download the exact artifact musl-static-build uploaded, rather than
      # rebuilding -- this proves the binary Task 5's job actually shipped
      # runs, not a fresh build that happens to also come out static.
      - name: Download static binary artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-grafter-musl-x86_64
          path: dist

      # upload-artifact's zip transport is not guaranteed to preserve the
      # executable bit across the round trip (flagged but left unverified
      # by the previous job's own upload step) -- always reassert +x here
      # rather than assuming it survived.
      - name: Restore executable bit
        run: chmod +x dist/agent-grafter

      # The point of testing three distros for a *statically linked* binary
      # is to catch a build that is secretly dynamically linked against
      # something present on the musl builder image but absent elsewhere.
      # Alpine is the sharpest test here: it ships no glibc at all, so a
      # binary that quietly depends on glibc fails loudly there and nowhere
      # else. Debian and Fedora both are glibc-based (different versions/
      # libc implementations of key shared libraries), so together the
      # three cover musl's two most common real-world targets: "some
      # glibc" and "no libc at all".
      #
      # Distro tags are deliberately unpinned (not a pinned digest): this
      # is a smoke test meant to catch drift in what each distro's
      # *current* official image ships, not a reproducible build input --
      # the same floating-tag choice this repo's own Dockerfile already
      # makes for its `rust:1-alpine` base.
      #
      # The binary is copied out of the read-only artifact mount into the
      # container's own filesystem before being invoked, rather than
      # executed in place from the bind mount: this repo's dev environment
      # has hit an NTFS/ntfs3 mount that breaks mmap-exec for statically
      # linked binaries (see Task 5's report), and copying to a normal
      # filesystem first is the same workaround Task 5 used locally.
      # GitHub-hosted runners don't have that problem, but doing it this
      # way is free and removes the question entirely.
      # `apply` is deliberately included, not just the read-only commands.
      # Materializing files is the entire reason this tool exists, so a
      # smoke test that only proves the shipped binary can parse arguments
      # and print diagnostics leaves the one thing users actually download
      # it for unexercised on the artifact itself. The cross-platform
      # `test` job in ci.yml covers `apply` thoroughly, but against a
      # natively-built binary -- not against this static musl build.
      #
      # Both materialization paths are covered, because they fail
      # differently: `copy` writes real bytes, `link` creates a directory
      # symlink (the primitive this project's whole safety argument is
      # about). Asserting on disk afterwards, rather than trusting the
      # command's own exit code, is the difference between "apply ran" and
      # "apply worked".
      - name: Run inside ${{ matrix.distro }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/artifact:ro" ${{ matrix.distro }} sh -c '
            set -eu
            cp /artifact/agent-grafter /tmp/agent-grafter
            chmod +x /tmp/agent-grafter
            echo "---- --version ----"
            /tmp/agent-grafter --version

            printf "source = \".\"\n" > /tmp/trivial.toml
            echo "---- doctor (trivial throwaway manifest -- exercises TOML parsing and the read-only diagnostics path, not just arg parsing) ----"
            /tmp/agent-grafter doctor --manifest /tmp/trivial.toml

            echo "---- apply (real materialization: one copy entry, one directory link) ----"
            mkdir -p /tmp/src/memory /tmp/src/agents /tmp/dest
            echo remembered > /tmp/src/memory/note.md
            echo skill > /tmp/src/agents/skill.md
            printf "source = \"/tmp/src\"\ncopy = [\"memory\"]\nlink = [\"agents\"]\n\n[targets.example]\ndest = \"/tmp/dest\"\n" > /tmp/real.toml
            /tmp/agent-grafter apply --manifest /tmp/real.toml

            echo "---- assert what actually landed on disk ----"
            test -f /tmp/dest/memory/note.md || { echo "FAIL: copy entry did not materialize"; exit 1; }
            grep -q remembered /tmp/dest/memory/note.md || { echo "FAIL: copied file has wrong content"; exit 1; }
            test -L /tmp/dest/agents || { echo "FAIL: link entry is not a symlink"; exit 1; }
            test -f /tmp/dest/agents/skill.md || { echo "FAIL: cannot read through the directory link"; exit 1; }
            echo "copy materialized, link materialized and traversable"

            echo "---- status (exit 0 proves apply left the install in sync) ----"
            /tmp/agent-grafter status --manifest /tmp/real.toml
          '
