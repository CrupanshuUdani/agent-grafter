name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Opt-in exFAT test volume. The fs_capability tests skip loudly when
      # SAFELINK_EXFAT_TEST_DIR is absent, so a failure here does NOT fail the
      # build — it only means exFAT coverage is skipped on this runner.
      #
      # Two mount strategies are tried:
      #   1. Kernel mount: `mount -o loop` — needs the `exfat` kernel module,
      #      which is absent from GitHub's default Ubuntu image (the format step
      #      succeeds but mount fails with "unknown filesystem type 'exfat'").
      #   2. Userspace/FUSE mount: `mount.exfat-fuse` from exfatprogs — does not
      #      need a kernel module, but needs /dev/fuse (not always exposed in
      #      containers). Falls back gracefully.
      - name: Set up exFAT test volume (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          truncate -s 64M /tmp/exfat.img
          sudo apt-get update -qq && sudo apt-get install -y -qq exfatprogs
          sudo mkfs.exfat /tmp/exfat.img
          sudo mkdir -p /mnt/exfat

          # Strategy 1: kernel mount. Expected to fail on GH Ubuntu runners
          # with "unknown filesystem type 'exfat'", which is fine.
          if sudo mount -o loop,uid=$(id -u),gid=$(id -g) /tmp/exfat.img /mnt/exfat 2>/tmp/mount_err; then
            echo "Kernel mount succeeded."
          else
            echo "Kernel mount unavailable ($(cat /tmp/mount_err | head -1)). Trying userspace/FUSE..."
            # Strategy 2: exfat-fuse userspace mount.
            # mount.exfat-fuse / exfatprogs' own mount helper invokes FUSE and
            # does not require a kernel module, only /dev/fuse.
            if command -v mount.exfat-fuse &>/dev/null; then
              sudo mount.exfat-fuse /tmp/exfat.img /mnt/exfat -o uid=$(id -u),gid=$(id -g),umask=0022
            elif command -v mount.exfat &>/dev/null; then
              sudo mount.exfat /tmp/exfat.img /mnt/exfat -o uid=$(id -u),gid=$(id -g),umask=0022
            else
              echo "No userspace exFAT mount helper available; skipping exFAT coverage."
              exit 0
            fi
          fi
          echo "SAFELINK_EXFAT_TEST_DIR=/mnt/exfat" >> $GITHUB_ENV

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose -- --nocapture

      # Enforces Global Constraint 6. #[cfg(windows)] tests do not FAIL on
      # other hosts, they are absent -- so assert the flagship test was really
      # executed here rather than silently compiled out or deleted. Runs
      # inside the matrix job; a second windows runner would prove nothing
      # extra.
      - name: Assert the safety suite actually ran on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test --test safety -- --nocapture 2>&1)
          echo "$out"
          echo "$out" | grep -q "removing_a_dir_link_never_deletes_the_targets_contents" \
            || { echo "::error::flagship safety test did not run on Windows"; exit 1; }
          echo "$out" | grep -qE "test result: ok\. 2 passed" \
            || { echo "::error::expected exactly 2 safety tests to pass on Windows"; exit 1; }

  fmt-and-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
