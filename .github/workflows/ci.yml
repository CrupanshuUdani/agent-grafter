name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Opt-in exFAT test volume — Windows only. The fs_capability tests skip
      # loudly when SAFELINK_EXFAT_TEST_DIR is absent, so a failure here does
      # NOT fail the build — it only means exFAT coverage is skipped.
      #
      # Creates a 64MB dynamic VHDX, mounts it, formats exFAT, exports the
      # drive letter. New-VHD/Mount-VHD require the Hyper-V module, which is
      # present on GitHub's Windows runners (they are Hyper-V VMs) but not
      # guaranteed. continue-on-error keeps the build green if setup fails.
      - name: Set up exFAT test volume
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = 'C:\safelink-exfat.vhdx'
          $size = 64MB

          New-VHD -Path $vhd -SizeBytes $size -Dynamic
          $vhdInfo = Mount-VHD -Path $vhd -PassThru
          $disk = $vhdInfo | Get-Disk
          $disk | Initialize-Disk -PartitionStyle MBR -Confirm:$false
          $partition = $disk | New-Partition -UseMaximumSize -AssignDriveLetter
          $vol = $partition | Format-Volume -FileSystem exFAT -NewFileSystemLabel SAFELINK -Confirm:$false
          $letter = ($vol | Get-Volume).DriveLetter
          if (-not $letter) { throw 'no drive letter assigned' }
          $dir = "${letter}:\\"
          $actualFs = (Get-Volume -DriveLetter $letter).FileSystemType
          if ($actualFs -ne 'exFAT') { throw "expected exFAT, got $actualFs" }
          "SAFELINK_EXFAT_TEST_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose -- --nocapture

      # Enforces Global Constraint 6. #[cfg(windows)] tests do not FAIL on
      # other hosts, they are absent -- so assert the flagship test was really
      # executed here rather than silently compiled out or deleted. Runs
      # inside the matrix job; a second windows runner would prove nothing
      # extra.
      - name: Assert the safety suite actually ran on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test --test safety -- --nocapture 2>&1)
          echo "$out"
          echo "$out" | grep -q "removing_a_dir_link_never_deletes_the_targets_contents" \
            || { echo "::error::flagship safety test did not run on Windows"; exit 1; }
          echo "$out" | grep -qE "test result: ok\. 2 passed" \
            || { echo "::error::expected exactly 2 safety tests to pass on Windows"; exit 1; }

  fmt-and-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install graft
        run: npm install -g @nanonets/graft@0.18.0
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check graft graph is up to date
        run: graft check
  blast-radius:
    name: blast radius
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install graft
        run: npm install -g @nanonets/graft@0.18.0
      - name: Blast radius
        id: blast
        env:
          GRAFT_PROVIDER: orcarouter
        run: |
          graft blast --base origin/main --format markdown > /tmp/blast.md 2>&1 || true
          echo "result<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/blast.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Post blast radius
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.blast.outputs.result }}`;
            if (body && body.trim()) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '### 🔥 Blast radius\n\n' + body
              });
            }