name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - about.toml
      - about.hbs
      - licenses/**
      - scripts/release-*.sh
      - scripts/check-version.sh

permissions:
  contents: read

# A newer push to the same PR supersedes the old dry run; tag and dispatch
# runs always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: prepare (version, notes, licences)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            bash scripts/check-version.sh "$REF_NAME"
            version="${REF_NAME#v}"
          else
            base="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "agent-grafter") | .version')"
            bash scripts/check-version.sh "v$base"
            # On pull requests GITHUB_SHA is a synthetic merge commit.
            version="${base}-dev.${HEAD_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p extras
          if [[ "$REF" == refs/tags/v* ]]; then
            bash scripts/release-notes.sh "${REF_NAME#v}" > extras/notes.md
          else
            # After a version bump, preview the section the tag will publish.
            base="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "agent-grafter") | .version')"
            if awk -v h="## [$base]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
              bash scripts/release-notes.sh "$base" > extras/notes.md
            else
              # A dry run publishes nothing, so an empty [Unreleased] is fine.
              rc=0
              bash scripts/release-notes.sh Unreleased > extras/notes.md || rc=$?
              [ "$rc" -eq 0 ] || [ "$rc" -eq 4 ] || exit "$rc"
            fi
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Only our own crates declare a publish list
        run: |
          set -euo pipefail
          others="$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.publish != null and .source != null) | .name')"
          [ -z "$others" ] || { echo "::error::left out of THIRD-PARTY-LICENSES by about.toml: $others"; exit 1; }
      - name: THIRD-PARTY-LICENSES
        env:
          # The musl Rust bundles for its musl targets; licenses/musl-COPYRIGHT is from this version.
          MUSL_VERSION: 1.2.5
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          libc="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-musl/lib/self-contained/libc.a"
          strings -a "$libc" > "$RUNNER_TEMP/libc.strings"
          if ! grep -qx "$MUSL_VERSION" "$RUNNER_TEMP/libc.strings"; then
            echo "::error::Rust's bundled musl is no longer $MUSL_VERSION; update licenses/musl-COPYRIGHT and MUSL_VERSION"
            exit 1
          fi
          cargo about generate about.hbs -o extras/THIRD-PARTY-LICENSES
          {
            echo "================================================================================"
            echo "musl libc $MUSL_VERSION (MIT), statically linked into the Linux binaries"
            echo "--------------------------------------------------------------------------------"
            cat licenses/musl-COPYRIGHT
          } >> extras/THIRD-PARTY-LICENSES
      - name: Collect files shipped in every archive
        run: cp LICENSE NOTICE README.md extras/
      - uses: actions/upload-artifact@v4
        with:
          name: extras
          path: extras/
          if-no-files-found: error

  linux:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            file_arch: x86-64
            tested: tested natively (static, run in Alpine)
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            file_arch: ARM aarch64
            tested: tested under QEMU emulation (static, run in Alpine)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # buildx's gha cache needs the runtime token, which `run:` steps don't get otherwise.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build
        run: |
          set -euo pipefail
          cache_to=()
          # A tag's cache can't be read by any later run, so tag builds only read.
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            cache_to=(--cache-to "type=gha,mode=max,scope=release-${{ matrix.target }}")
          fi
          docker buildx build --platform "${{ matrix.platform }}" --target export \
            --cache-from "type=gha,scope=release-${{ matrix.target }}" \
            "${cache_to[@]}" \
            --output type=local,dest=dist -f Dockerfile .
      - name: Verify architecture, static linking, and that it runs
        run: |
          set -euo pipefail
          file dist/agent-grafter | tee /dev/stderr | grep -q "${{ matrix.file_arch }}"
          if readelf -l dist/agent-grafter | grep -qi interp; then
            echo "::error::binary needs a dynamic loader"; exit 1
          fi
          docker run --rm --platform "${{ matrix.platform }}" -v "$PWD/dist:/a:ro" alpine \
            sh -c 'cp /a/agent-grafter /tmp/ag && chmod +x /tmp/ag && /tmp/ag --version'
      - uses: actions/download-artifact@v4
        with:
          name: extras
          path: extras
      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TESTED: ${{ matrix.tested }}
        run: |
          set -euo pipefail
          bash scripts/release-package.sh "$VERSION" "${{ matrix.target }}" dist/agent-grafter out extras
          echo "| \`${{ matrix.target }}\` | $TESTED |" > "out/${{ matrix.target }}.status"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  native:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Static CRT: Windows doesn't guarantee VCRUNTIME140.dll, and installing it needs admin rights.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: agent-grafter
            run: native
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: agent-grafter
            run: rosetta
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: agent-grafter.exe
            run: native
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: agent-grafter.exe
            run: none
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p agent-grafter
      - name: Run it where this runner can
        id: run
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          case "${{ matrix.run }}" in
            native)
              "$bin" --version
              echo "tested=tested natively" >> "$GITHUB_OUTPUT" ;;
            rosetta)
              if arch -x86_64 /usr/bin/true 2>/dev/null; then
                arch -x86_64 "$bin" --version
                echo "tested=tested under Rosetta 2" >> "$GITHUB_OUTPUT"
              else
                echo "tested=build only (no Rosetta 2 on the runner)" >> "$GITHUB_OUTPUT"
              fi ;;
            none)
              echo "tested=build only (cross-compiled; no arm64 Windows runner)" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: extras
          path: extras
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TESTED: ${{ steps.run.outputs.tested }}
        run: |
          set -euo pipefail
          bash scripts/release-package.sh "$VERSION" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/${{ matrix.exe }}" out extras
          echo "| \`${{ matrix.target }}\` | $TESTED |" > "out/${{ matrix.target }}.status"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    name: release
    needs: [prepare, linux, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble, checksum, write notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          cp artifacts/build-*/*.tar.gz artifacts/build-*/*.zip dist/
          cp artifacts/extras/THIRD-PARTY-LICENSES dist/
          count="$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          [ "$count" -eq 6 ] || { echo "::error::expected 6 archives, got $count"; exit 1; }
          for z in dist/*windows-msvc.zip; do
            # grep -q here would let pipefail turn an early exit into a false pass.
            # shellcheck disable=SC2143
            if [ -n "$(unzip -p "$z" '*/agent-grafter.exe' | strings -a | grep -ix 'vcruntime140.dll')" ]; then
              echo "::error::$z needs VCRUNTIME140.dll"; exit 1
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            cat artifacts/extras/notes.md
            echo
            echo "### Binaries"
            echo
            echo "These binaries are unsigned, so macOS Gatekeeper and Windows SmartScreen will warn on first run. See the README's Install section. Verify downloads against \`SHA256SUMS\`."
            echo
            echo "| Target | Status in this release's CI |"
            echo "|---|---|"
            cat artifacts/build-*/*.status | sort
          } > notes.md
          cat notes.md
      - name: Create the GitHub Release as a draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A draft isn't public, so Gate B can run on the exact assets before
        # anyone can download them.
        run: gh release create "$TAG" --draft --verify-tag --title "agent-grafter $TAG" --notes-file notes.md dist/*
      - name: Upload the dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md
