name: Publish crates

# Manual only. crates.io versions can be yanked but never deleted, so a tag
# push must never be able to publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Already-released tag to publish, e.g. v0.1.0"
        required: true
      confirm:
        description: 'Type "publish" to confirm. crates.io versions can never be deleted.'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      TAG: ${{ inputs.tag }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo "::error::confirm input was not 'publish'; nothing published"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate versions
        run: bash scripts/check-version.sh "$TAG"
      - name: The GitHub Release for this tag is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --json isDraft -q .isDraft)" || { echo "::error::no published $TAG release is visible; publish the draft first"; exit 1; }
          [ "$draft" = "false" ] || { echo "::error::the $TAG release is still a draft; publish it first"; exit 1; }
      - name: Package and verify both crates before publishing anything
        run: cargo publish --dry-run --locked -p safelink -p agent-grafter
      - name: Publish safelink
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # A re-run after agent-grafter failed must resume, not stop here.
          if curl -sf https://index.crates.io/sa/fe/safelink | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "safelink $version is already on crates.io; skipping"
          else
            cargo publish --locked -p safelink
          fi
      # cargo publish waits for the crates.io index, so agent-grafter can
      # resolve safelink straight away.
      - name: Publish agent-grafter
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p agent-grafter
